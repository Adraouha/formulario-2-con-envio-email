<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Personalización de tu coche</title>
  </head>
  <body>
    <div class="slogan">
      <h1 class="titulo">Personaliza tu coche</h1>
      <img src="img/icono.png" alt="Coche personalizado" class="coche-slogan" />
    </div>
    <div class="formulario">
      <h2 class="titulo-formulario">Configura tu coche ideal</h2>
      <p>
        Selecciona las opciones que deseas para tu nuevo coche y envía tu
        solicitud
      </p>
      <form action="/recibido.html" method="GET">
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_next" value="recibido.html" />
        <input type="hidden" name="_captcha" value="false" />

        <div class="container">
          <!-- datos personales -->
          <fieldset>
            <legend>Datos personales</legend>
            <div class="form-group">
              <label for="nombre">Nombre:</label>
              <input
                type="text"
                name="nombre"
                id="nombre"
                placeholder="Ingresa tu nombre"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Ingresa tu email"
                required
              />
            </div>
            <figure class="logo">
              <img src="img/icono.png" alt="Icono de coche" class="cocheicon" />
              <h4 class="subtitulo-logo">
                <span>COPE</span> - Coche Personalizado
              </h4>
            </figure>
          </fieldset>

          <!-- opciones del coche -->
          <fieldset>
            <legend>Opciones de compra</legend>

            <!-- select-option para menu desplegable -->
            <div class="form-group">
              <label for="coche">Selecciona modelo de coche:</label>
              <select name="coche" id="coche" required>
                <option value="">Selecciona una opción</option>
                <option value="ninguno">Ninguno</option>
                <option value="2 caballos">2 Caballos</option>
                <option value="Maserati">Maserati</option>
                <option value="Ferrari">Ferrari</option>
              </select>
            </div>

            <!-- radio button precisa del mismo NAME para todos -->
            <div class="form-group">
              <div class="subtitulo">País de matriculación:</div>
              <div class="radio-group">
                <div class="radio-option">
                  <input
                    type="radio"
                    name="matricula"
                    value="espana"
                    id="espana"
                    required
                  />
                  <label for="espana">España</label>
                </div>
                <div class="radio-option">
                  <input
                    type="radio"
                    name="matricula"
                    value="andorra"
                    id="andorra"
                  />
                  <label for="andorra">Andorra</label>
                </div>
                <div class="radio-option">
                  <input
                    type="radio"
                    name="matricula"
                    value="francia"
                    id="francia"
                  />
                  <label for="francia">Francia</label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="subtitulo">Extras:</div>
              <!-- checkbox: puedes elegir más de una opción -->
              <div class="checkbox-group">
                <div class="checkbox-option">
                  <input
                    type="checkbox"
                    name="extra1"
                    id="elevalunas"
                    value="elevalunas"
                  />
                  <label for="elevalunas">Elevalunas eléctrico</label>
                </div>
                <div class="checkbox-option">
                  <input
                    type="checkbox"
                    name="extra2"
                    id="sensor"
                    value="sensor"
                  />
                  <label for="sensor">Sensor de aparcamiento</label>
                </div>
                <div class="checkbox-option">
                  <input
                    type="checkbox"
                    name="extra3"
                    id="airbags"
                    value="airbags"
                  />
                  <label for="airbags">Airbags</label>
                </div>
                <div class="checkbox-option">
                  <input
                    type="checkbox"
                    name="extra4"
                    id="calefactables"
                    value="calefactables"
                  />
                  <label for="calefactables">Asientos calefactables</label>
                </div>
              </div>
            </div>
          </fieldset>
        </div>
        <button type="submit">Enviar Solicitud</button>
      </form>
    </div>
  </body>
</html>
